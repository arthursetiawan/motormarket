{% extends "base.html" %}

{% block title %}Create listing — MotorMarket{% endblock %}

{% block content %}
<header class="page-header">
  <h1>Create listing</h1>
  <p class="tagline">List your motorcycle for auction</p>
</header>

<div class="form-panel">
  <form method="post" enctype="multipart/form-data" id="listing-form">
    {% csrf_token %}
    {{ form.as_p }}
    <div id="preview" style="margin:12px 0"></div>
    <button class="btn" type="submit">Create listing</button>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const fileInput = document.querySelector('input[type=file]');
  const preview = document.getElementById('preview');
  if (fileInput) {
    fileInput.addEventListener('change', e => {
      preview.innerHTML = '';
      const file = e.target.files[0];
      if (!file) return;
      const img = document.createElement('img');
      img.style.maxWidth = '320px';
      img.style.borderRadius = '8px';
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
  }
</script>
{% endblock %}
